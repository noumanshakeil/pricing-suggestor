<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Anchor on competitors, adjust for feature density, explain the number.</p>
<div class="grid"><section class="card">
<form method="post" action="/ui/quotes"><label>Package</label><input name="package" value="Pro"/>
<label>Anchor $</label><input name="anchor" type="number" value="99"/>
<label>Features</label><textarea name="features" rows="5" required>SSO\nAudit logs\nPriority support</textarea>
<button type="submit">Suggest</button></form></section>
<section class="card">{% for q in quotes %}<article class="card" style="margin:.4rem 0">
<span class="pill">${{ '%.0f'|format(q.suggested) }}</span> {{ q.package }}
<pre>{{ q.rationale }}</pre></article>{% endfor %}</section></div></main></body></html>
